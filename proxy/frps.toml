# frps — серверная часть обратного туннеля. Запускается КАК СЕРВИС в
# docker-compose.yml лендинга (сервис `frps`), на той же сети `web`, что и nginx.
#
#   frpc (на твоём ПК) --- подключается к :7000 ---> frps (на VPS)
#   nginx (location /web/) --- ходит к frps:7001 ---> туннель ---> ПК web:3001
#
# Токен берётся из окружения (FRP_TOKEN в .env) — в git его не коммитим.
# frp сам раскрывает {{ .Envs.X }} при чтении конфига.

bindPort = 7000

auth.method = "token"
auth.token  = "{{ .Envs.FRP_TOKEN }}"

# Разрешаем клиенту публиковать только порт 7001 (к нему ходит nginx).
# Порт 7001 НЕ публикуется наружу (нет в ports: у сервиса frps) — только 7000.
allowPorts = [
  { start = 7001, end = 7001 }
]
