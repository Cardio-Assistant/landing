services:
  app:
    image: ${IMAGE:-ghcr.io/cardio-assistant/landing:latest}
    pull_policy: always
    container_name: ai-cardio-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/about"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Обратный туннель: принимает соединение с домашнего ПК (frpc) и даёт nginx
  # доступ к web-приложению на ПК по адресу frps:7001 (внутри сети web).
  # Наружу открыт только 7000 (к нему подключается frpc); 7001 не публикуется.
  frps:
    image: snowdreamtech/frps:0.61.1
    container_name: ai-cardio-frps
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./proxy/frps.toml:/etc/frp/frps.toml:ro
    ports:
      - "7000:7000"
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-cardio-nginx
    restart: unless-stopped
    depends_on:
      - app
      - frps
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/var/www/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - web
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!};
      nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: ai-cardio-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

networks:
  web:
    driver: bridge
