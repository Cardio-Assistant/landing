<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cardio Assistant — временно недоступно</title>
<style>
  :root { --bg:#f6f8fc; --card:#ffffff; --fg:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#111a2e; --fg:#e8eefc; --muted:#93a1c0; --line:rgba(255,255,255,.08); --accent:#60a5fa; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card {
    max-width: 520px; width:100%; text-align:center;
    background: var(--card); border:1px solid var(--line); border-radius: 20px; padding: 40px 28px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height:1.6; margin: 0 0 8px; }
  a { color: var(--accent); }
  .brand { margin-top: 22px; font-size:.8rem; color: var(--muted); letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
  <main class="card">
    <h1>Сервис временно недоступен</h1>
    <p>Сервер Cardio Assistant сейчас не отвечает — идёт обслуживание или перезапуск. Попробуйте обновить страницу через несколько минут.</p>
    <p>Если доступ нужен срочно, напишите на <a href="mailto:support@ai-cardio.ru">support@ai-cardio.ru</a>.</p>
    <div class="brand">Cardio Assistant</div>
  </main>
</body>
</html>
